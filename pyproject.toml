[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-authz"
version = "0.1.0"
description = "Context-aware authorization for LLM agent tool calls (Week 1 thin slice)"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6", "requests>=2.31", "jsonschema>=4.20"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["opa: needs a running OPA server (docker compose up -d)"]
